<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js wheeled vehicle demo<br/>
		WASD to drive, Z for hand brake</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, setOnUpdate, createVehicleTrack, addToScene, DegreesToRadians, LAYER_MOVING } from './js/example.js';

			const wheelRadius = 0.3, wheelWidth = 0.1;
			const halfVehicleLength = 2.0, halfVehicleWidth = 0.9, halfVehicleHeight = 0.2;
			const wheelOffsetHorizontal = 1.4, wheelOffsetVertical = 0.18;
			const suspensionMinLength = 0.3, suspensionMaxLength = 0.5;
			const maxSteerAngle = DegreesToRadians(30);
			const fourWheelDrive = true;
			const leftRightLimitedSlipRatio = 1.4, frontBackLimitedSlipRatio = 1.4;
			const FL_WHEEL = 0, FR_WHEEL = 1, BL_WHEEL = 2, BR_WHEEL = 3;
			const vehicleMass = 1500.0, maxEngineTorque = 500.0, clutchStrength = 10.0;
			let previousForward = 1.0;

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { physicsSystem, bodyInterface, camera, controls } = Example;
			const quatY = (angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle); return [q.x, q.y, q.z, q.w]; };

			createVehicleTrack();

			const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
			const _m = new Float32Array(16);
			const createThreeWheel = (constraint, wheelIndex, body) => {
				const wheelSetting = constraint.GetWheel(wheelIndex).GetSettings();
				const wheel = new THREE.Mesh(new THREE.CylinderGeometry(wheelSetting.mRadius, wheelSetting.mRadius, wheelSetting.mWidth, 20, 1), wheelMaterial);
				wheel.matrixAutoUpdate = false;
				body.add(wheel);
				wheel.updateLocalTransform = () => {
					constraint.GetWheelLocalTransform(_m, wheelIndex, [0, 1, 0], [1, 0, 0]);
					wheel.matrix.fromArray(_m);
				};
				wheel.updateLocalTransform();
				return wheel;
			};

			// car body: an offset-COM box, rendered at its origin transform so wheels align
			const carShape = new Jolt.OffsetCenterOfMassShapeSettings([0, -halfVehicleHeight, 0],
				new Jolt.BoxShape([halfVehicleWidth, halfVehicleHeight, halfVehicleLength])).Create().Get();
			const carBodySettings = new Jolt.BodyCreationSettings(carShape, [0, 2, 0], quatY(Math.PI), Jolt.EMotionType.Dynamic, LAYER_MOVING);
			carBodySettings.mOverrideMassProperties = Jolt.EOverrideMassProperties.CalculateInertia;
			carBodySettings.GetMassPropertiesOverride().mMass = vehicleMass;
			const carBody = bodyInterface.CreateBody(carBodySettings);
			bodyInterface.AddBody(carBody.GetID(), Jolt.EActivation.Activate);
			const car = new THREE.Mesh(new THREE.BoxGeometry(2 * halfVehicleWidth, 2 * halfVehicleHeight, 2 * halfVehicleLength), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
			car.matrixAutoUpdate = false;
			car.userData = { id: carBody.GetID(), com: false };   // origin transform (GetWorldTransform)
			Example.scene.add(car);
			Example.dynamicObjects.push(car);
			{
				const back = new THREE.Mesh(new THREE.BoxGeometry(2 * halfVehicleWidth, .75, 2, 1, 1, 1), car.material);
				back.position.set(0, 2 * halfVehicleHeight, -1);
				car.add(back);
			}

			const vehicle = new Jolt.VehicleConstraintSettings();
			vehicle.mMaxPitchRollAngle = DegreesToRadians(60.0);
			const mkWheel = (x, z, steer, handBrake) => {
				const w = new Jolt.WheelSettingsWV();
				w.mPosition = [x, -wheelOffsetVertical, z];
				w.mMaxSteerAngle = steer; w.mMaxHandBrakeTorque = handBrake;
				w.mRadius = wheelRadius; w.mWidth = wheelWidth;
				w.mSuspensionMinLength = suspensionMinLength; w.mSuspensionMaxLength = suspensionMaxLength;
				vehicle.AddWheel(w);
			};
			mkWheel(halfVehicleWidth, wheelOffsetHorizontal, maxSteerAngle, 0.0);   // FL
			mkWheel(-halfVehicleWidth, wheelOffsetHorizontal, maxSteerAngle, 0.0);  // FR
			mkWheel(halfVehicleWidth, -wheelOffsetHorizontal, 0.0, 4000.0);         // BL
			mkWheel(-halfVehicleWidth, -wheelOffsetHorizontal, 0.0, 4000.0);        // BR

			const controllerSettings = new Jolt.WheeledVehicleControllerSettings();
			controllerSettings.GetEngine().mMaxTorque = maxEngineTorque;
			controllerSettings.GetTransmission().mClutchStrength = clutchStrength;
			vehicle.SetController(controllerSettings);
			const frontDiff = new Jolt.VehicleDifferentialSettings();
			frontDiff.mLeftWheel = FL_WHEEL; frontDiff.mRightWheel = FR_WHEEL; frontDiff.mLimitedSlipRatio = leftRightLimitedSlipRatio;
			if (fourWheelDrive) frontDiff.mEngineTorqueRatio = 0.5;
			controllerSettings.AddDifferential(frontDiff);
			controllerSettings.mDifferentialLimitedSlipRatio = frontBackLimitedSlipRatio;
			if (fourWheelDrive) {
				const rearDiff = new Jolt.VehicleDifferentialSettings();
				rearDiff.mLeftWheel = BL_WHEEL; rearDiff.mRightWheel = BR_WHEEL; rearDiff.mLimitedSlipRatio = leftRightLimitedSlipRatio; rearDiff.mEngineTorqueRatio = 0.5;
				controllerSettings.AddDifferential(rearDiff);
			}
			for (const [l, r] of [[FL_WHEEL, FR_WHEEL], [BL_WHEEL, BR_WHEEL]]) {
				const bar = new Jolt.VehicleAntiRollBar(); bar.mLeftWheel = l; bar.mRightWheel = r; vehicle.AddAntiRollBar(bar);
			}

			const constraint = new Jolt.VehicleConstraint(carBody, vehicle);
			constraint.SetVehicleCollisionTester(new Jolt.VehicleCollisionTesterCastCylinder(LAYER_MOVING, 0.05));
			physicsSystem.AddConstraint(constraint);
			Jolt.addVehicleStepListener(physicsSystem, constraint);   // VehicleConstraint is also a step listener
			const controller = constraint.GetWheeledController();

			const modelWheels = [];
			for (let i = 0; i < 4; i++) modelWheels.push(createThreeWheel(constraint, i, car));

			const input = { forwardPressed: false, backwardPressed: false, leftPressed: false, rightPressed: false, handBrake: false };
			const _r = new Float32Array(4), _v = new Float32Array(3), _p = new Float32Array(3);
			const prePhysicsUpdate = () => {
				let forward = input.forwardPressed ? 1.0 : (input.backwardPressed ? -1.0 : 0.0);
				let right = input.rightPressed ? 1.0 : (input.leftPressed ? -1.0 : 0.0);
				let brake = 0.0, handBrake = 0.0;
				if (previousForward * forward < 0.0) {
					carBody.GetRotation(_r); carBody.GetLinearVelocity(_v);
					const rot = new THREE.Quaternion(_r[0], _r[1], _r[2], _r[3]).conjugate();
					const velocity = new THREE.Vector3(_v[0], _v[1], _v[2]).applyQuaternion(rot).z;
					if ((forward > 0.0 && velocity < -0.1) || (forward < 0.0 && velocity > 0.1)) { forward = 0.0; brake = 1.0; }
					else previousForward = forward;
				}
				if (input.handBrake) { forward = 0.0; handBrake = 1.0; }
				controller.SetDriverInput(forward, right, brake, handBrake);
				if (right != 0.0 || forward != 0.0 || brake != 0.0 || handBrake != 0.0)
					bodyInterface.ActivateBody(carBody.GetID());
			};

			controls.target = car.position;
			carBody.GetPosition(_p); let oldPos = new THREE.Vector3(_p[0], _p[1], _p[2]);
			setOnUpdate(() => {
				prePhysicsUpdate();
				carBody.GetPosition(_p); const pos = new THREE.Vector3(_p[0], _p[1], _p[2]);
				camera.position.add(pos.clone().sub(oldPos)); oldPos = pos;
				modelWheels.forEach(wheel => wheel.updateLocalTransform());
			});

			document.addEventListener('keydown', (e) => { const k = e.key; if (k == 'w') input.forwardPressed = true; else if (k == 's') input.backwardPressed = true; else if (k == 'a') input.leftPressed = true; else if (k == 'd') input.rightPressed = true; else if (k == 'z') input.handBrake = true; }, false);
			document.addEventListener('keyup', (e) => { const k = e.key; if (k == 'w') input.forwardPressed = false; else if (k == 's') input.backwardPressed = false; else if (k == 'a') input.leftPressed = false; else if (k == 'd') input.rightPressed = false; else if (k == 'z') input.handBrake = false; }, false);
		</script>
	</body>
</html>
