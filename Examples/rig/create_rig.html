<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js skeleton rig creation demo</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import { initExample, createFloor, addToThreeScene, physicsSystem, camera, LAYER_MOVING, DegreesToRadians } from '../js/example.js';

			const Jolt = await initJolt();

			initExample(Jolt, null);
			createFloor();

			const skeleton = new Jolt.Skeleton();
			const lower_body  = skeleton.AddRootJoint("LowerBody");
			const mid_body    = skeleton.AddJoint("MidBody",    lower_body);
			const upper_body  = skeleton.AddJoint("UpperBody",  mid_body);
			                    skeleton.AddJoint("Head",        upper_body);
			const upper_arm_l = skeleton.AddJoint("UpperArmL",  upper_body);
			const upper_arm_r = skeleton.AddJoint("UpperArmR",  upper_body);
			                    skeleton.AddJoint("LowerArmL",  upper_arm_l);
			                    skeleton.AddJoint("LowerArmR",  upper_arm_r);
			const upper_leg_l = skeleton.AddJoint("UpperLegL",  lower_body);
			const upper_leg_r = skeleton.AddJoint("UpperLegR",  lower_body);
			                    skeleton.AddJoint("LowerLegL",  upper_leg_l);
			                    skeleton.AddJoint("LowerLegR",  upper_leg_r);

			const shapes = [
				new Jolt.CapsuleShape(0.15, 0.10),  // Lower Body
				new Jolt.CapsuleShape(0.15, 0.10),  // Mid Body
				new Jolt.CapsuleShape(0.15, 0.10),  // Upper Body
				new Jolt.CapsuleShape(0.075, 0.10), // Head
				new Jolt.CapsuleShape(0.15, 0.06),  // Upper Arm L
				new Jolt.CapsuleShape(0.15, 0.06),  // Upper Arm R
				new Jolt.CapsuleShape(0.15, 0.05),  // Lower Arm L
				new Jolt.CapsuleShape(0.15, 0.05),  // Lower Arm R
				new Jolt.CapsuleShape(0.2, 0.075),  // Upper Leg L
				new Jolt.CapsuleShape(0.2, 0.075),  // Upper Leg R
				new Jolt.CapsuleShape(0.2, 0.06),   // Lower Leg L
				new Jolt.CapsuleShape(0.2, 0.06),   // Lower Leg R
			];

			// In embind, positions/rotations are plain arrays
			const Z90 = [0, 0, Math.SQRT1_2, Math.SQRT1_2]; // 90° about Z
			const ID  = [0, 0, 0, 1];                        // identity
			const positions = [
				[0,      1.15, 0],   // Lower Body
				[0,      1.35, 0],   // Mid Body
				[0,      1.55, 0],   // Upper Body
				[0,      1.825, 0],  // Head
				[-0.425, 1.55, 0],   // Upper Arm L
				[0.425,  1.55, 0],   // Upper Arm R
				[-0.8,   1.55, 0],   // Lower Arm L
				[0.8,    1.55, 0],   // Lower Arm R
				[-0.15,  0.8,  0],   // Upper Leg L
				[0.15,   0.8,  0],   // Upper Leg R
				[-0.15,  0.3,  0],   // Lower Leg L
				[0.15,   0.3,  0],   // Lower Leg R
			];
			const rotations = [
				Z90, Z90, Z90, ID,
				Z90, Z90, Z90, Z90,
				ID,  ID,  ID,  ID,
			];
			const constraint_positions = [
				null,              // Lower Body (root — no parent)
				[0,     1.25, 0],  // Mid Body
				[0,     1.45, 0],  // Upper Body
				[0,     1.65, 0],  // Head
				[-0.225, 1.55, 0], // Upper Arm L
				[0.225,  1.55, 0], // Upper Arm R
				[-0.65,  1.55, 0], // Lower Arm L
				[0.65,   1.55, 0], // Lower Arm R
				[-0.15,  1.05, 0], // Upper Leg L
				[0.15,   1.05, 0], // Upper Leg R
				[-0.15,  0.55, 0], // Lower Leg L
				[0.15,   0.55, 0], // Lower Leg R
			];
			const twist_axis = [
				null,
				[0, 1, 0],  // Mid Body (Y)
				[0, 1, 0],  // Upper Body
				[0, 1, 0],  // Head
				[1, 0, 0],  // Upper Arm L (X)
				[1, 0, 0],  // Upper Arm R
				[-1, 0, 0], // Lower Arm L (-X)
				[1, 0, 0],  // Lower Arm R
				[0, -1, 0], // Upper Leg L (-Y)
				[0, -1, 0], // Upper Leg R
				[0, -1, 0], // Lower Leg L
				[0, -1, 0], // Lower Leg R
			];
			const twist_angle  = [0, 5,  5,  90, 45, 45, 45, 45, 45, 45, 45, 45];
			const normal_angle = [0, 10, 10, 45, 90, 90, 0,  0,  45, 45, 0,  0 ];
			const plane_angle  = [0, 10, 10, 45, 45, 45, 90, 90, 45, 45, 60, 60];

			const settings = new Jolt.RagdollSettings();
			settings.SetSkeleton(skeleton);
			settings.ResizeParts(skeleton.GetJointCount());
			for (let p = 0; p < skeleton.GetJointCount(); ++p) {
				const part = settings.GetPart(p);
				part.SetShape(shapes[p]);
				part.mPosition = positions[p];
				part.mRotation = rotations[p];
				part.mMotionType = Jolt.EMotionType.Dynamic;
				part.mObjectLayer = LAYER_MOVING;
				if (p > 0) {
					const c = new Jolt.SwingTwistConstraintSettings();
					c.mDrawConstraintSize = 0.1;
					c.mPosition1 = c.mPosition2 = constraint_positions[p];
					c.mTwistAxis1 = c.mTwistAxis2 = twist_axis[p];
					c.mPlaneAxis1 = c.mPlaneAxis2 = [0, 0, 1];
					c.mTwistMinAngle = -DegreesToRadians(twist_angle[p]);
					c.mTwistMaxAngle =  DegreesToRadians(twist_angle[p]);
					c.mNormalHalfConeAngle = DegreesToRadians(normal_angle[p]);
					c.mPlaneHalfConeAngle  = DegreesToRadians(plane_angle[p]);
					part.SetToParent(c);
				}
			}

			settings.Stabilize();
			settings.DisableParentChildCollisions();

			const ragdoll = settings.CreateRagdoll(0, 0, physicsSystem);
			ragdoll.AddToPhysicsSystem(Jolt.EActivation.Activate);

			for (let i = 0; i < ragdoll.GetBodyCount(); i++)
				addToThreeScene(ragdoll.GetBodyID(i), 0xFF00FF);

			ragdoll.SetLinearAndAngularVelocity([1, 7, 0], [7, 0, 7]);

			camera.position.set(0, 2, 8);
		</script>
	</body>
</html>
