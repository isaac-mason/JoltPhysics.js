<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js Load Rig demo<br/>
			<label>Constraint Type: <select id="constraintTypes"></select></label>
		</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import { initExample, createFloor, addToThreeScene, dynamicObjects, physicsSystem, scene, camera } from '../js/example.js';
			import { RagdollLoader } from '../js/ragdoll_loader.js';

			const Jolt = await initJolt();

			const sTypes = ["Fixed", "Point", "Hinge", "Slider", "Cone", "Ragdoll"];
			let sConstraintType = "Ragdoll";

			initExample(Jolt, null);

			scene.add(new THREE.AmbientLight(0xFFFFFF, 0.2));
			createFloor();

			let bodyThreeJs = [];
			let mRagdoll; // kept alive by the onchange closure below (the app owns the Ragdoll)

			const dropdown = document.getElementById('constraintTypes');
			sTypes.forEach(type => {
				const option = document.createElement('option');
				option.value = option.innerText = type;
				dropdown.appendChild(option);
			});
			dropdown.value = sConstraintType;

			async function createRagdoll() {
				const type = dropdown.value;
				const mRagdollSettings = await RagdollLoader.load(Jolt, "../assets/Human/Human.tof", Jolt.EMotionType.Dynamic, type);

				// Detach the render meshes ONLY — do not destroy the bodies here. The Ragdoll owns
				// its bodies; RemoveFromPhysicsSystem + delete below remove/destroy them. Using
				// removeFromScene() (which RemoveBody+DestroyBody) would destroy them first, then
				// RemoveFromPhysicsSystem would touch already-freed bodies -> crash.
				bodyThreeJs.forEach(obj => {
					scene.remove(obj);
					const idx = dynamicObjects.indexOf(obj);
					if (idx >= 0) dynamicObjects.splice(idx, 1);
				});
				bodyThreeJs = [];

				if (mRagdoll) {
					mRagdoll.RemoveFromPhysicsSystem();
					mRagdoll.delete();
				}

				mRagdoll = mRagdollSettings.CreateRagdoll(0, 0, physicsSystem);
				mRagdoll.AddToPhysicsSystem(Jolt.EActivation.Activate);

				for (let i = 0; i < mRagdoll.GetBodyCount(); i++) {
					addToThreeScene(mRagdoll.GetBodyID(i), 0xFF00FF);
					bodyThreeJs.push(dynamicObjects[dynamicObjects.length - 1]);
				}
			}

			dropdown.onchange = () => createRagdoll();
			createRagdoll();

			camera.position.set(0, 2, -4);
		</script>
	</body>
</html>
