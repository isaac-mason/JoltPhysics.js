<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js Kinematic Rig demo<br/>
			<label>Animation: <select id="sAnimations"></select></label>
		</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import { initExample, createFloor, addToThreeScene, addToScene, removeFromScene, dynamicObjects, physicsSystem, bodyInterface, scene, camera, LAYER_MOVING } from '../js/example.js';
			import { RagdollLoader } from '../js/ragdoll_loader.js';

			const Jolt = await initJolt();

			const sAnimations = ["Neutral", "Walk", "Sprint", "Dead_Pose1", "Dead_Pose2", "Dead_Pose3", "Dead_Pose4"];
			let sAnimationName = "Walk";
			let mAnimation, mPose, mRagdoll;
			let mAnimationTime = 0;

			initExample(Jolt, (mTime, mDeltaTime) => {
				if (mAnimation && mPose && mRagdoll) {
					mAnimation.Sample(mAnimationTime, mPose);
					mAnimationTime += mDeltaTime;
					mPose.CalculateJointMatrices();
					mRagdoll.DriveToPoseUsingKinematics(mPose, mDeltaTime);
				}
			});

			scene.add(new THREE.AmbientLight(0xFFFFFF, 0.2));
			createFloor();

			let boxes = [];
			function buildBoxes() {
				boxes.forEach(box => removeFromScene(box));
				boxes = [];
				const shape = new Jolt.BoxShape([0.2, 0.2, 0.2]);
				const rot = [0, 0, 0, 1];
				for (let i = 0; i < 3; ++i)
					for (let j = i / 2; j < 10 - (i + 1) / 2; ++j) {
						const pos = [-2.0 + j * 0.4 + (i & 1 ? 0.2 : 0.0), 0.2 + i * 0.4, -2.0];
						const bcs = new Jolt.BodyCreationSettings(shape, pos, rot, Jolt.EMotionType.Dynamic, LAYER_MOVING);
						bcs.mFriction = 0.1;
						bcs.mOverrideMassProperties = Jolt.EOverrideMassProperties.CalculateInertia;
						bcs.GetMassPropertiesOverride().mMass = 1;
						addToScene(bodyInterface.CreateBody(bcs), 0x00ffff);
						boxes.push(dynamicObjects[dynamicObjects.length - 1]);
					}
			}

			const dropdown = document.getElementById('sAnimations');
			sAnimations.forEach(type => {
				const option = document.createElement('option');
				option.value = option.innerText = type;
				dropdown.appendChild(option);
			});
			dropdown.value = sAnimationName;

			const mRagdollSettings = await RagdollLoader.load(Jolt, "../assets/Human/Human.tof", Jolt.EMotionType.Kinematic, "Ragdoll");
			mRagdoll = mRagdollSettings.CreateRagdoll(0, 0, physicsSystem);
			mRagdoll.AddToPhysicsSystem(Jolt.EActivation.Activate);
			for (let i = 0; i < mRagdoll.GetBodyCount(); i++)
				addToThreeScene(mRagdoll.GetBodyID(i), 0xFF00FF);

			mPose = new Jolt.SkeletonPose();
			mPose.SetSkeleton(mRagdollSettings.GetSkeleton());

			async function loadAnimation() {
				if (mAnimation) { mAnimation.delete(); mAnimation = undefined; }
				buildBoxes();
				sAnimationName = dropdown.value;
				mAnimation = await RagdollLoader.loadAnimation(Jolt, "../assets/Human/animations/" + sAnimationName.toLowerCase() + ".tof");
				mAnimationTime = 0;
			}

			dropdown.onchange = () => loadAnimation();
			loadAnimation();

			camera.position.set(0, 3, -8);
		</script>
	</body>
</html>
