<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js buoyancy demo<br/>
		A ball floats down a channel through moving and standing water (ApplyBuoyancyImpulse)</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, setOnUpdate, createBox, createSphere, addToScene, dynamicObjects, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { physicsSystem, bodyInterface } = Example;
			const IDENT = [0, 0, 0, 1];
			const quatZ = (angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), angle); return [q.x, q.y, q.z, q.w]; };

			function createSensorBox(position, halfExtent, color) {
				const bcs = new Jolt.BodyCreationSettings(new Jolt.BoxShape(halfExtent), position, IDENT, Jolt.EMotionType.Static, LAYER_NON_MOVING);
				bcs.mIsSensor = true;
				const body = bodyInterface.CreateBody(bcs);
				addToScene(body, color);
				dynamicObjects[dynamicObjects.length - 1].material.wireframe = true;
				return body;
			}

			// channel walls
			createBox([12, 8, -15], quatZ(-0.2 * Math.PI), [0.2, 6, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([8.5, -1, -15], IDENT, [0.2, 4, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([0, -6, -15], IDENT, [0.2, 5, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([-15, -8, -15], IDENT, [0.2, 3.25, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([-8, -14, -15], IDENT, [30, 3, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([11, -8, -15], IDENT, [11, 3, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);

			const ball = createSphere([10, 12, -15], 1, Jolt.EMotionType.Dynamic, LAYER_MOVING, 0xFF0000);
			const ballID = ball.GetID();
			const movingWater = createSensorBox([5.5, -2, -15], [5.5, 4.5, 1.5], 0x1111FF);
			const movingWaterID = movingWater.GetID();
			const standingWater = createSensorBox([-7.5, -8.5, -15], [7.5, 2, 1.5], 0x1133FF);
			const standingWaterID = standingWater.GetID();

			const buoyancy = 1.1, linearDrag = 0.3, angularDrag = 0.05;
			const surfaceNormal = [0, 1, 0], gravity = [0, -9.8, 0];
			let inMovingWater = false, inStandingWater = false;

			physicsSystem.SetContactListener(new Jolt.ContactListener.implement({
				OnContactValidate: () => Jolt.ValidateResult.AcceptAllContactsForThisBodyPair,
				OnContactAdded: onContact,
				OnContactPersisted: onContact,
				OnContactRemoved: () => {},
			}));
			function onContact(body1, body2, manifold, settings) {
				const id1 = body1.GetID(), id2 = body2.GetID();
				if (id1 == ballID || id2 == ballID) {
					if (id1 == movingWaterID || id2 == movingWaterID) inMovingWater = true;
					if (id1 == standingWaterID || id2 == standingWaterID) inStandingWater = true;
				}
			}

			setOnUpdate((time, deltaTime) => {
				if (inMovingWater)
					ball.ApplyBuoyancyImpulse([0, 2.5, 0], surfaceNormal, buoyancy, linearDrag, angularDrag, [-0.5, 0, 0], gravity, deltaTime);
				if (inStandingWater)
					ball.ApplyBuoyancyImpulse([0, -6.5, 0], surfaceNormal, buoyancy, linearDrag, angularDrag, [0, 0, 0], gravity, deltaTime);
				inMovingWater = inStandingWater = false;
			});
		</script>
	</body>
</html>
