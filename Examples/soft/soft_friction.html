<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js soft body friction demo<br />
		Soft spheres and cubes launched sideways (+Z) with increasing friction (left to right)</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as Example from '../js/example.js';
			import { initExample, createFloor, addSoftBodyToScene, LAYER_MOVING } from '../js/example.js';
			import { createSphere, createCube } from '../js/soft-body-creator.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { bodyInterface, camera } = Example;
			camera.position.z += 40;
			const floor = createFloor();
			floor.SetFriction(1.0);

			const sphereSettings = createSphere(Jolt);
			sphereSettings.SetAllVertexVelocities([0, 0, 10]);   // launch sideways
			const sphere = new Jolt.SoftBodyCreationSettings(sphereSettings, [0, 0, 0], [0, 0, 0, 1], LAYER_MOVING);
			sphere.mPressure = 2000.0;
			for (let i = 0; i <= 10; ++i) {
				sphere.mPosition = [-40.0 + i * 8.0, 1.0, 0];
				sphere.mFriction = 0.1 * i;
				addSoftBodyToScene(bodyInterface.CreateSoftBody(sphere), sphereSettings, 0x333333 + (i << 20) + ((10 - i) << 12));
			}

			const cubeSettings = createCube(Jolt);
			cubeSettings.SetAllVertexVelocities([0, 0, 10]);
			const cube = new Jolt.SoftBodyCreationSettings(cubeSettings, [0, 0, 0], [0, 0, 0, 1], LAYER_MOVING);
			for (let i = 0; i <= 10; ++i) {
				cube.mPosition = [-40.0 + i * 8.0, 1.0, -5.0];
				cube.mFriction = 0.1 * i;
				addSoftBodyToScene(bodyInterface.CreateSoftBody(cube), cubeSettings, 0x333333 + (i << 4) + ((10 - i) << 20));
			}
		</script>
	</body>
</html>
