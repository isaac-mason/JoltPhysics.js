<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js soft body pressure demo<br />
		Soft spheres with increasing internal pressure (left to right); mUpdatePosition = false</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as Example from '../js/example.js';
			import { initExample, createFloor, addSoftBodyToScene, LAYER_MOVING } from '../js/example.js';
			import { createSphere } from '../js/soft-body-creator.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { bodyInterface, camera } = Example;
			createFloor();
			camera.position.z += 40;

			const sphereSettings = createSphere(Jolt, 2.0);
			const sphere = new Jolt.SoftBodyCreationSettings(sphereSettings, [0, 0, 0], [0, 0, 0, 1], LAYER_MOVING);
			for (let i = 0; i <= 10; ++i) {
				sphere.mPosition = [-40 + i * 8, 10, 0];
				sphere.mPressure = 1000.0 * i;
				sphere.mUpdatePosition = false;
				addSoftBodyToScene(bodyInterface.CreateSoftBody(sphere), sphereSettings, (25 * i) | 0x00aa00 | (((10 - i) * 25) << 16));
			}
		</script>
	</body>
</html>
