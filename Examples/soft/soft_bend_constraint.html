<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="../style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js soft body bend constraint demo<br />
		Cloths and spheres with no / distance / dihedral bend constraints (red / green / blue)</div>

		<script type="module">
			import initJolt from '../../dist/jolt-physics.wasm-compat.js';
			import * as Example from '../js/example.js';
			import { initExample, createFloor, addSoftBodyToScene, LAYER_MOVING } from '../js/example.js';
			import { createCloth, createSphere } from '../js/soft-body-creator.js';

			function xorshift32(a) {
				a = new Uint32Array([a]);
				return function () { let x = a[0]; x ^= x << 13; x ^= x >> 17; x ^= x << 5; a[0] = x; return a[0] / 0xFFFFFFFF; };
			}
			const cNumVerticesX = 10, cNumVerticesZ = 10, cVertexSpacing = 0.5;

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { bodyInterface } = Example;
			createFloor();

			const inv_mass = (x, z) => z < 2 ? 0 : 1;
			const random_float = (v) => 0.2 * v - 0.1;
			const perturbation = (seed) => {
				const random = xorshift32(seed);
				return (_x, inZ) => ({ x: random_float(random()), y: inZ & 1 ? 0.1 : -0.1, z: random_float(random()) });
			};
			const COLOR_NONE = 0xaa0000, COLOR_DISTANCE = 0x00aa00, COLOR_DIHEDRAL = 0x0000aa;
			const IDENT = [0, 0, 0, 1];

			const addCloth = (bendType, x, color) => {
				const s = createCloth(Jolt, cNumVerticesX, cNumVerticesZ, cVertexSpacing, inv_mass, perturbation(1234), bendType);
				addSoftBodyToScene(bodyInterface.CreateSoftBody(new Jolt.SoftBodyCreationSettings(s, [x, 5, 0], IDENT, LAYER_MOVING)), s, color);
			};
			addCloth(Jolt.EBendType.None, -5, COLOR_NONE);
			addCloth(Jolt.EBendType.Distance, 0, COLOR_DISTANCE);
			addCloth(Jolt.EBendType.Dihedral, 5, COLOR_DIHEDRAL);

			const addSphere = (bendType, x, color) => {
				const s = createSphere(Jolt, 1.0, 10, 20, bendType);
				addSoftBodyToScene(bodyInterface.CreateSoftBody(new Jolt.SoftBodyCreationSettings(s, [x, 5, 10], IDENT, LAYER_MOVING)), s, color);
			};
			addSphere(Jolt.EBendType.None, -5, COLOR_NONE);
			addSphere(Jolt.EBendType.Distance, 0, COLOR_DISTANCE);
			addSphere(Jolt.EBendType.Dihedral, 5, COLOR_DIHEDRAL);
		</script>
	</body>
</html>
