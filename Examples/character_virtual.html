<!DOCTYPE html>
<html lang="en">

<head>
	<title>JoltPhysics.js demo</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>
</head>

<body>
	<div id="container">Loading...</div>
	<div id="info">
		JoltPhysics.js character demo<br />
		WASD to move, Space to jump, Shift to crouch<br />
		<select id="collision-shape">
			<option value="Capsule">Capsule</option>
			<option value="Cylinder">Cylinder</option>
			<option value="Box">Box</option>
		</select>
	</div>

	<script type="module">
		// If you haven't built locally, swap for: https://www.unpkg.com/jolt-physics/dist/jolt-physics.wasm-compat.js
		import initJolt from '../dist/jolt-physics.wasm-compat.js';
		import * as THREE from 'three';
		import * as Example from './js/example.js';
		import { initExample, setOnUpdate, createFloor, createBox, addToScene, DegreesToRadians, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

		const Jolt = await initJolt();

		// Initialize this example
		initExample(Jolt, null);
		const { jolt, physicsSystem, bodyInterface, camera, controls, scene } = Example;

		// quaternion helpers (mathcat arrays)
		const quatAxisAngle = (x, y, z, angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(x, y, z), angle); return [q.x, q.y, q.z, q.w]; };
		const IDENTITY = [0, 0, 0, 1];
		const _s = new Float32Array(16);
		const readV3 = (readInto) => { readInto(_s); return new THREE.Vector3(_s[0], _s[1], _s[2]); };  // like the old wrapVec3(getter())

		const characterHeightStanding = 2;
		const characterRadiusStanding = 1;
		const characterHeightCrouching = 1;
		const characterRadiusCrouching = 0.8;

		// Character movement properties
		const controlMovementDuringJump = true;					///< If false the character cannot change movement direction in mid air
		const characterSpeed = 6.0;
		const jumpSpeed = 15.0;

		const enableCharacterInertia = true;

		const upRotationX = 0;
		const upRotationZ = 0;
		const maxSlopeAngle = DegreesToRadians(45.0);
		const maxStrength = 100.0;
		const characterPadding = 0.02;
		const penetrationRecoverySpeed = 1.0;
		const predictiveContactDistance = 0.1;
		const enableWalkStairs = true;
		const enableStickToFloor = true;

		let shapeType = 'Capsule';
		let standingShape;
		let crouchingShape;
		let threeStandingGeometry;
		let threeCrouchingGeometry;

		let character;
		let isCrouched = false;
		let allowSliding = false;

		const geometry = new THREE.BoxGeometry(1, 1, 1);
		const material = new THREE.MeshPhongMaterial({ color: 0xffff00 });
		let threeCharacter = new THREE.Mesh(geometry, material);
		let desiredVelocity = new THREE.Vector3();

		const updateSettings = new Jolt.ExtendedUpdateSettings();

		const initShape = () => {
			const positionStanding = [0, 0.5 * characterHeightStanding + characterRadiusStanding, 0];
			const positionCrouching = [0, 0.5 * characterHeightCrouching + characterRadiusCrouching, 0];

			switch (shapeType) {
				case 'Capsule':
					standingShape = new Jolt.RotatedTranslatedShapeSettings(positionStanding, IDENTITY, new Jolt.CapsuleShape(0.5 * characterHeightStanding, characterRadiusStanding)).Create().Get();
					crouchingShape = new Jolt.RotatedTranslatedShapeSettings(positionCrouching, IDENTITY, new Jolt.CapsuleShape(0.5 * characterHeightCrouching, characterRadiusCrouching)).Create().Get();

					threeStandingGeometry = new THREE.CapsuleGeometry(characterRadiusStanding, characterHeightStanding, 4, 8).translate(0, 0.5 * characterHeightStanding + characterRadiusStanding, 0);
					threeCrouchingGeometry = new THREE.CapsuleGeometry(characterRadiusCrouching, characterHeightCrouching, 4, 8).translate(0, 0.5 * characterHeightCrouching + characterRadiusCrouching, 0);
					break;

				case 'Cylinder':
					standingShape = new Jolt.RotatedTranslatedShapeSettings(positionStanding, IDENTITY, new Jolt.CylinderShape(0.5 * characterHeightStanding + characterRadiusStanding, characterRadiusStanding)).Create().Get();
					crouchingShape = new Jolt.RotatedTranslatedShapeSettings(positionCrouching, IDENTITY, new Jolt.CylinderShape(0.5 * characterHeightCrouching + characterRadiusCrouching, characterRadiusCrouching)).Create().Get();

					threeStandingGeometry = new THREE.CylinderGeometry(characterRadiusStanding, characterRadiusStanding, 2 * characterRadiusStanding + characterHeightStanding, 8, 4).translate(0, 0.5 * characterHeightStanding + characterRadiusStanding, 0);
					threeCrouchingGeometry = new THREE.CylinderGeometry(characterRadiusCrouching, characterRadiusCrouching, 2 * characterRadiusCrouching + characterHeightCrouching, 8, 4).translate(0, 0.5 * characterHeightCrouching + characterRadiusCrouching, 0);
					break;

				case 'Box':
					standingShape = new Jolt.RotatedTranslatedShapeSettings(positionStanding, IDENTITY, new Jolt.BoxShape([characterRadiusStanding, 0.5 * characterHeightStanding + characterRadiusStanding, characterRadiusStanding])).Create().Get();
					crouchingShape = new Jolt.RotatedTranslatedShapeSettings(positionCrouching, IDENTITY, new Jolt.BoxShape([characterRadiusCrouching, 0.5 * characterHeightCrouching + characterRadiusCrouching, characterRadiusCrouching])).Create().Get();

					threeStandingGeometry = new THREE.BoxGeometry(2 * characterRadiusStanding, 2 * characterRadiusStanding + characterHeightStanding, 2 * characterRadiusStanding).translate(0, 0.5 * characterHeightStanding + characterRadiusStanding, 0);
					threeCrouchingGeometry = new THREE.BoxGeometry(2 * characterRadiusCrouching, 2 * characterRadiusCrouching + characterHeightCrouching, 2 * characterRadiusCrouching).translate(0, 0.5 * characterHeightCrouching + characterRadiusCrouching, 0);
					break;
			}
		}

		const lavaObject = createBox([0, -50, 0], IDENTITY, [1000, 2, 1000], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0xcc2222);
		const lavaObjectId = lavaObject.GetID();
		let isInLava = false;

		const conveyorBeltObject = createBox([0, 0, -10], IDENTITY, [10, 0.25, 2], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x2222cc);
		const conveyorBeltObjectId = conveyorBeltObject.GetID();

		const characterContactListener = new Jolt.CharacterContactListener.implement({
			// Apply artificial velocity to the character when standing on the conveyor belt
			OnAdjustBodyVelocity: (character, body2, linearVelocity, angularVelocity) => {
				if (body2.GetID() == conveyorBeltObjectId)
					return { linear: [linearVelocity[0] + 5, linearVelocity[1], linearVelocity[2]] };
			},
			OnContactValidate: (character, bodyID2, subShapeID2) => {
				if (bodyID2 == lavaObjectId)
					isInLava = true; // Can't modify velocity or position at this point, marking that we want to teleport
				return true;
			},
			// Don't allow the player to slide down static not-too-steep surfaces when not actively
			// moving and when not on a moving platform
			OnContactSolve: (character, bodyID2, subShapeID2, contactPosition, contactNormal, contactVelocity, characterVelocity, newCharacterVelocity) => {
				const contactVel = new THREE.Vector3(contactVelocity[0], contactVelocity[1], contactVelocity[2]);
				if (!allowSliding && contactVel.lengthSq() < 1.0e-12 && !character.IsSlopeTooSteep(contactNormal))
					return { velocity: [0, 0, 0] };
			},
		});

		const prePhysicsUpdate = (deltaTime) => {
			if (isInLava) {
				// Teleport the user back to the origin if they fall off the platform
				character.SetPosition([0, 10, 0]);
				isInLava = false;
			}
			const characterUp = readV3((o) => character.GetUp(o));
			if (!enableStickToFloor) {
				updateSettings.mStickToFloorStepDown = [0, 0, 0];
			} else {
				const len = new THREE.Vector3(...updateSettings.mStickToFloorStepDown).length();
				updateSettings.mStickToFloorStepDown = characterUp.clone().multiplyScalar(-len).toArray();
			}
			if (!enableWalkStairs) {
				updateSettings.mWalkStairsStepUp = [0, 0, 0];
			} else {
				const len = new THREE.Vector3(...updateSettings.mWalkStairsStepUp).length();
				updateSettings.mWalkStairsStepUp = characterUp.clone().multiplyScalar(len).toArray();
			}

			// gravity along -up
			const gravity = characterUp.clone().multiplyScalar(-readV3((o) => physicsSystem.GetGravity(o)).length());
			character.ExtendedUpdate(deltaTime, gravity.toArray(), updateSettings, LAYER_MOVING, jolt);

			threeCharacter.position.copy(readV3((o) => character.GetPosition(o)));
		}

		const handleInput = (movementDirection, jump, switchStance, deltaTime) => {
			const playerControlsHorizontalVelocity = controlMovementDuringJump || character.IsSupported();
			if (playerControlsHorizontalVelocity) {
				// True if the player intended to move
				allowSliding = !(movementDirection.length() < 1.0e-12);
				// Smooth the player input
				if (enableCharacterInertia) {
					desiredVelocity.multiplyScalar(0.75).add(movementDirection.multiplyScalar(0.25 * characterSpeed))
				} else {
					desiredVelocity.copy(movementDirection).multiplyScalar(characterSpeed);
				}
			} else {
				// While in air we allow sliding
				allowSliding = true;
			}
			const characterUpRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(upRotationX, 0, upRotationZ));
			character.SetUp(new THREE.Vector3(0, 1, 0).applyQuaternion(characterUpRotation).toArray());
			character.SetRotation([characterUpRotation.x, characterUpRotation.y, characterUpRotation.z, characterUpRotation.w]);
			const upRotation = characterUpRotation;

			character.UpdateGroundVelocity();
			const characterUp = readV3((o) => character.GetUp(o));
			const linearVelocity = readV3((o) => character.GetLinearVelocity(o));
			const currentVerticalVelocity = characterUp.clone().multiplyScalar(linearVelocity.dot(characterUp));
			const groundVelocity = readV3((o) => character.GetGroundVelocity(o));
			const gravity = readV3((o) => physicsSystem.GetGravity(o));

			let newVelocity;
			const movingTowardsGround = (currentVerticalVelocity.y - groundVelocity.y) < 0.1;
			const groundNormal = readV3((o) => character.GetGroundNormal(o)).toArray();
			if (character.GetGroundState() == Jolt.EGroundState.OnGround					// If on ground
				&& (enableCharacterInertia ?
					movingTowardsGround													// Inertia enabled: And not moving away from ground
					: !character.IsSlopeTooSteep(groundNormal)))						// Inertia disabled: And not on a slope that is too steep
			{
				// Assume velocity of ground when on ground
				newVelocity = groundVelocity;

				// Jump
				if (jump && movingTowardsGround)
					newVelocity.add(characterUp.multiplyScalar(jumpSpeed));
			}
			else
				newVelocity = currentVerticalVelocity.clone();

			// Gravity
			newVelocity.add(gravity.multiplyScalar(deltaTime).applyQuaternion(upRotation));

			if (playerControlsHorizontalVelocity) {
				// Player input
				newVelocity.add(desiredVelocity.clone().applyQuaternion(upRotation));
			} else {
				// Preserve horizontal velocity
				const currentHorizontalVelocity = linearVelocity.sub(currentVerticalVelocity);
				newVelocity.add(currentHorizontalVelocity);
			}

			character.SetLinearVelocity(newVelocity.toArray());
		}

		const setCrouched = (crouched, forceUpdate) => {
			if (crouched != isCrouched || forceUpdate) {
				const newShape = crouched ? crouchingShape : standingShape;
				const newGeometry = crouched ? threeCrouchingGeometry : threeStandingGeometry;
				if (character.SetShape(newShape,
					1.5 * physicsSystem.GetPhysicsSettings().mPenetrationSlop,
					LAYER_MOVING, jolt)) {
					// Accept the new shape only when the SetShape call was successful
					isCrouched = crouched;
					threeCharacter.geometry = newGeometry;
				}
			}
		}

		// Create a basic floor
		createFloor();

		createBox([-45, 1, 0], IDENTITY, [0.5, 2, 45], Jolt.EMotionType.Static, LAYER_NON_MOVING);
		createBox([45, 1, 0], IDENTITY, [0.5, 2, 45], Jolt.EMotionType.Static, LAYER_NON_MOVING);

		// Stairs
		for (let j = 0; j < 5; j++) {
			let stepHeight = 0.3 + 0.1 * j;
			for (let i = 1; i < 10; i++) {
				createBox([15 + 5 * j, i * stepHeight - 0.5 + stepHeight / 2, -20 - i * 3], IDENTITY, [2, stepHeight / 2, 2], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			}
		}

		// Slopes
		for (let i = 0; i < 10; i++) {
			createBox([-40 + 5 * i, 2, -25], quatAxisAngle(1, 0, 0, DegreesToRadians(70 - i * 5.0)), [2.5, 0.6, 8], Jolt.EMotionType.Static, LAYER_NON_MOVING);
		}

		{
			// Create a push-able block
			const boxHalfExtent = 0.75;
			let shape = new Jolt.BoxShape([boxHalfExtent, boxHalfExtent, boxHalfExtent]);
			let creationSettings = new Jolt.BodyCreationSettings(shape, [-10.0, 5.0, 10.0], IDENTITY, Jolt.EMotionType.Dynamic, LAYER_MOVING);
			creationSettings.mFriction = 0.1;
			creationSettings.mOverrideMassProperties = Jolt.EOverrideMassProperties.CalculateInertia;
			creationSettings.GetMassPropertiesOverride().mMass = 1;
			let body = bodyInterface.CreateBody(creationSettings);
			addToScene(body, 0x00ffff);
		}

		initShape();

		const settings = new Jolt.CharacterVirtualSettings();
		settings.mMass = 1000;
		settings.mMaxSlopeAngle = maxSlopeAngle;
		settings.mMaxStrength = maxStrength;
		settings.SetShape(standingShape);
		settings.mBackFaceMode = Jolt.EBackFaceMode.CollideWithBackFaces;
		settings.mCharacterPadding = characterPadding;
		settings.mPenetrationRecoverySpeed = penetrationRecoverySpeed;
		settings.mPredictiveContactDistance = predictiveContactDistance;
		settings.SetSupportingVolume([0, 1, 0], -characterRadiusStanding);
		character = new Jolt.CharacterVirtual(settings, [0, 0, 0], IDENTITY, physicsSystem);
		character.SetListener(characterContactListener);

		threeCharacter.geometry = threeStandingGeometry;
		scene.add(threeCharacter);

		controls.target = threeCharacter.position;

		const input = {
			forwardPressed: false,
			backwardPressed: false,
			leftPressed: false,
			rightPressed: false,
			jump: false,
			crouched: false
		}

		const cameraRotation = new THREE.Quaternion();
		setOnUpdate((time, deltaTime) => {
			setCrouched(input.crouched);
			camera.getWorldQuaternion(cameraRotation);
			let forward = input.forwardPressed ? 1.0 : (input.backwardPressed ? -1.0 : 0.0);
			let right = input.rightPressed ? 1.0 : (input.leftPressed ? -1.0 : 0.0);
			const cameraDirectionV = new THREE.Vector3(right, 0, -forward).applyQuaternion(cameraRotation);
			cameraDirectionV.y = 0;
			cameraDirectionV.normalize().multiplyScalar(2);
			handleInput(cameraDirectionV, input.jump, input.switchStance, deltaTime);

			const oldPosition = readV3((o) => character.GetPosition(o));
			prePhysicsUpdate(deltaTime)
			const newdPosition = readV3((o) => character.GetPosition(o));
			camera.position.add(newdPosition.sub(oldPosition));
		});

		document.addEventListener("keydown", onDocumentKeyDown, false);
		document.addEventListener("keyup", onDocumentKeyUp, false);
		function onDocumentKeyDown(event) {
			var keyCode = event.which;
			if (keyCode == 87) { input.forwardPressed = true; }
			else if (keyCode == 83) { input.backwardPressed = true; }
			else if (keyCode == 65) { input.leftPressed = true; }
			else if (keyCode == 68) { input.rightPressed = true; }
			else if (keyCode == 32) { input.jump = true; }
			else if (keyCode == 16) { input.crouched = true; }
		};
		function onDocumentKeyUp(event) {
			var keyCode = event.which;
			if (keyCode == 87) { input.forwardPressed = false; }
			else if (keyCode == 83) { input.backwardPressed = false; }
			else if (keyCode == 65) { input.leftPressed = false; }
			else if (keyCode == 68) { input.rightPressed = false; }
			else if (keyCode == 32) { input.jump = false; }
			else if (keyCode == 16) { input.crouched = false; }
		};

		const collisionShapeElement = document.getElementById('collision-shape');
		collisionShapeElement.addEventListener('change', () => {
			shapeType = collisionShapeElement.value;
			initShape();
			setCrouched(input.crouched, true);
		})

		physicsSystem.SetGravity([0, -25, 0])
	</script>
</body>
</html>
