		<path d="m 131.82521,-0.31461863 c -12.8301,0.14919851 -23.95522,15.16188663 -26.74258,27.68644163 -6.044679,27.160828 33.25594,51.843194 27.0572,78.969277 -2.7589,12.07312 -14.0554,23.60354 -26.11335,26.42797 C 78.708159,139.16806 53.727239,98.917477 26.427966,105.39725 14.305629,108.27462 0.27732218,119.68074 0.31461863,132.13983 0.38965154,157.20499 28.107135,185.9305 53.17055,185.625 65.411052,185.4758 75.622589,170.81839 78.340042,158.88241 84.495278,131.84651 46.843062,106.59462 53.17055,79.598516 56.064748,67.250477 67.263371,55.175361 79.598516,52.226694 106.69459,45.749485 131.43431,85.917183 158.5678,79.598516 170.91829,76.722417 185.38498,65.22204 185.31038,52.541312 185.16293,27.476469 156.88879,-0.6060776 131.82521,-0.31461863 Z" />
	</svg>
		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, createFloor, createBox, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			class Line3DMesh {
				constructor(points, color) { this._points = points; this._geometry = new THREE.BufferGeometry().setFromPoints(points); this._line = new THREE.Line(this._geometry, new THREE.LineBasicMaterial({ color })); }
				update() { this._geometry.setFromPoints(this._points); }
				getMesh() { return this._line; }
			}
			const updates = [];
			initExample(Jolt, () => updates.forEach((f) => f()));
			const { physicsSystem, dynamicObjects } = Example;
			createFloor();
			const NORMAL = [0, 1, 0];

			// Sample an SVG path into a recentered/scaled point list + a PathConstraintPath impl.
			function makeSVGPath(svgPath, velocity, scale, sampleRate) {
				const points = [];
				const total = svgPath.getTotalLength();
				for (let i = 0; i < total; i += sampleRate) { const p = svgPath.getPointAtLength(i); points.push(new THREE.Vector3(p.x, p.y, 0)); }
				const bb = { minx: Infinity, miny: Infinity, maxx: -Infinity, maxy: -Infinity };
				points.forEach((p) => { bb.minx = Math.min(bb.minx, p.x); bb.miny = Math.min(bb.miny, p.y); bb.maxx = Math.max(bb.maxx, p.x); bb.maxy = Math.max(bb.maxy, p.y); });
				const w = bb.maxx - bb.minx, h = bb.maxy - bb.miny, cx = (bb.maxx + bb.minx) / 2, cy = (bb.maxy + bb.miny) / 2;
				points.forEach((p) => p.set((p.x - cx) / w * scale, 0, (p.y - cy) / h * scale));
				const length = points.length;
				const cur = new THREE.Vector3();
				const searchRange = (indexA, indexB, iterations) => {
					const distA = points[Math.floor((indexA + length) % length)].distanceTo(cur);
					const distB = points[Math.floor((indexB + length) % length)].distanceTo(cur);
					const indexDelta = indexB - indexA;
					if (distA == 0) return indexA;
					if (distB == 0) return indexB;
					const next = indexA + (distA / (distA + distB)) * indexDelta;
					if (iterations == 1 || Math.abs(indexA - indexB) < 1) return next;
					return searchRange(next - 0.125 * indexDelta, next + 0.125 * indexDelta, iterations - 1);
				};
				const impl = {
					GetPathMaxFraction: () => length,
					GetClosestPoint: (position, fractionHint) => { cur.set(position[0], position[1], position[2]); return (searchRange(fractionHint - velocity, fractionHint + velocity, 6) + length) % length; },
					GetPointOnPath: (inFraction) => {
						const iA = Math.floor(inFraction + length) % length;
						const iB = Math.ceil(inFraction + 0.001 + length) % length;
						const pos = new THREE.Vector3().lerpVectors(points[iA], points[iB], inFraction - Math.floor(inFraction));
						const tan = new THREE.Vector3().subVectors(points[iB], points[iA]).normalize();
						const bin = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(...NORMAL)).normalize();
						return { position: pos.toArray(), tangent: tan.toArray(), normal: NORMAL, binormal: bin.toArray() };
					},
				};
				return { impl, points };
			}

			const positionMaterial = new THREE.MeshPhongMaterial({ color: '#00ff00' });
			const positionGeo = new THREE.SphereGeometry(0.25, 32, 32);
			function renderPathData(impl, points, parent, constraint, pathColor) {
				parent.add(new Line3DMesh(points, pathColor).getMesh());
				const pos = new THREE.Mesh(positionGeo, positionMaterial); parent.add(pos);
				const tanLine = new Line3DMesh([new THREE.Vector3(), new THREE.Vector3()], '#FF0000'); pos.add(tanLine.getMesh());
				const normLine = new Line3DMesh([new THREE.Vector3(), new THREE.Vector3()], '#00FF00'); pos.add(normLine.getMesh());
				const binLine = new Line3DMesh([new THREE.Vector3(), new THREE.Vector3()], '#FF00FF'); pos.add(binLine.getMesh());
				updates.push(() => {
					const d = impl.GetPointOnPath(constraint.GetPathFraction());
					pos.position.fromArray(d.position);
					tanLine._points[1].fromArray(d.tangent); tanLine.update();
					normLine._points[1].fromArray(d.normal); normLine.update();
					binLine._points[1].fromArray(d.binormal); binLine.update();
				});
			}

			function buildSVGPath(selector, ox, oz, color, sampleRate) {
				const { impl, points } = makeSVGPath(document.querySelector(selector), 2, 7, sampleRate);
				const path = new Jolt.PathConstraintPath.implement(impl);
				path.SetIsLooping(true);
				const box1 = createBox([ox, 5, oz], [0, 0, 0, 1], [0.5, 0.1, 0.5], Jolt.EMotionType.Static, LAYER_NON_MOVING);
				const anchor = dynamicObjects[dynamicObjects.length - 1];
				const zero = points[5];
				const box2 = createBox([zero.x + ox, zero.y + 5, zero.z + oz], [0, 0, 0, 1], [0.5, 0.1, 0.5], Jolt.EMotionType.Dynamic, LAYER_MOVING, '#ff0000');
				const settings = new Jolt.PathConstraintSettings();
				settings.mRotationConstraintType = Jolt.EPathRotationConstraintType.Free;
				const constraint = settings.Create(box1, box2);
				constraint.SetPath(path, 5);
				physicsSystem.AddConstraint(constraint);
				constraint.SetPositionMotorState(Jolt.EMotorState.Velocity);
				constraint.SetTargetVelocity(2);
				renderPathData(impl, points, anchor, constraint, color);
			}
			buildSVGPath('#svgHeart path', -8, 0, 'red', 5);
			buildSVGPath('#svgStar path', 0, 0, 'yellow', 0.5);
			buildSVGPath('#svgLoops path', 8, 0, 'blue', 6);
			buildSVGPath('#svgTriangle path', -8, 8, 'cyan', 5);
			buildSVGPath('#svgX path', 0, 8, 'pink', 5);
			buildSVGPath('#svgFigure8 path', 8, 8, 'orange', 5);
		</script>
