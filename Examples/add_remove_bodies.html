<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js add / remove bodies demo<br/>
		Bodies are continuously spawned and the oldest removed</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as Example from './js/example.js';
			import { initExample, createFloor, addToScene, removeFromScene, getRandomQuat, LAYER_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			var objectTimePeriod = 0.01;
			var timeNextSpawn = Example.time + objectTimePeriod;

			initExample(Jolt, onUpdate);
			const bodyInterface = Example.bodyInterface;
			const dynamicObjects = Example.dynamicObjects;

			createFloor();

			function generateObject() {
				let pos = [(Math.random() - 0.5) * 25, 15, (Math.random() - 0.5) * 25];
				let rot = getRandomQuat();

				let shape = new Jolt.BoxShape([0.5, 0.5, 0.5]);
				let creationSettings = new Jolt.BodyCreationSettings(shape, pos, rot, Jolt.EMotionType.Dynamic, LAYER_MOVING);
				creationSettings.mRestitution = 0.5;
				let body = bodyInterface.CreateBody(creationSettings);

				addToScene(body, 0xff0000);

				if (dynamicObjects.length > 200)
					removeFromScene(dynamicObjects[1]); // Leave the floor alone
			}

			function onUpdate(time, deltaTime) {
				if (time > timeNextSpawn) {
					generateObject();
					timeNextSpawn = time + objectTimePeriod;
				}
			}
		</script>
	</body>
</html>
