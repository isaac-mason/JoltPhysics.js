<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js 2D funnel demo<br/>
		Spheres constrained to a 2D plane (EAllowedDOFs.Plane2D) fall through a funnel</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, createFloor, createBox, addToScene, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const bodyInterface = Example.bodyInterface;
			const quatAxisAngle = (x, y, z, angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(x, y, z), angle); return [q.x, q.y, q.z, q.w]; };

			createFloor();

			createBox([-12, 8, -5], quatAxisAngle(0, 0, 1, 0.2 * Math.PI), [0.1, 10, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);
			createBox([12, 8, -5], quatAxisAngle(0, 0, 1, -0.2 * Math.PI), [0.1, 10, 1], Jolt.EMotionType.Static, LAYER_NON_MOVING);

			let shape = new Jolt.SphereShape(0.5);
			let creationSettings = new Jolt.BodyCreationSettings(shape, [0, 0, 0], [0, 0, 0, 1], Jolt.EMotionType.Dynamic, LAYER_MOVING);
			creationSettings.mAllowedDOFs = Jolt.EAllowedDOFs.Plane2D;

			for (let x = 0; x < 20; ++x)
				for (let y = 0; y < 10; ++y) {
					creationSettings.mPosition = [-10 + x, 10 + y, -5];
					let body = bodyInterface.CreateBody(creationSettings);
					addToScene(body, 0xff0000);
				}
		</script>
	</body>
</html>
