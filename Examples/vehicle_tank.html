<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js tracked vehicle (tank) demo<br/>
		WASD to drive; A/D pivot-turn on the spot at low speed</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, setOnUpdate, createVehicleTrack, DegreesToRadians, LAYER_MOVING } from './js/example.js';

			const wheelRadius = 0.3, wheelWidth = 0.1;
			const halfVehicleLength = 3.2, halfVehicleWidth = 1.7, halfVehicleHeight = 0.5;
			const suspensionMinLength = 0.3, suspensionMaxLength = 0.5, suspensionFrequency = 1.0;
			const halfTurretWidth = 1.4, halfTurretLength = 2.0, halfTurretHeight = 0.4;
			const halfBarrelLength = 1.5, barrelRadius = 0.1;
			const vehicleMass = 4000.0, maxPitchRollAngle = DegreesToRadians(60.0);
			const wheelPos = [[-0.0, 2.95], [-0.3, 2.1], [-0.3, 1.4], [-0.3, 0.7], [-0.3, 0.0], [-0.3, -0.7], [-0.3, -1.4], [-0.3, -2.1], [-0.0, -2.75]];
			let previousForward = 1.0;

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { physicsSystem, bodyInterface, camera, controls } = Example;
			const quatY = (angle) => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle); return [q.x, q.y, q.z, q.w]; };

			createVehicleTrack();

			const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });
			const tankMat1 = new THREE.MeshPhongMaterial({ color: 0x993333 });
			const tankMat2 = new THREE.MeshPhongMaterial({ color: 0x663333 });
			const _m = new Float32Array(16);
			const createThreeWheel = (constraint, wheelIndex, body) => {
				const s = constraint.GetWheel(wheelIndex).GetSettings();
				const wheel = new THREE.Mesh(new THREE.CylinderGeometry(s.mRadius, s.mRadius, s.mWidth, 20, 1), wheelMaterial);
				wheel.matrixAutoUpdate = false;
				body.add(wheel);
				wheel.updateLocalTransform = () => { constraint.GetWheelLocalTransform(_m, wheelIndex, [0, 1, 0], [1, 0, 0]); wheel.matrix.fromArray(_m); };
				wheel.updateLocalTransform();
				return wheel;
			};

			const tankShape = new Jolt.OffsetCenterOfMassShapeSettings([0, -halfVehicleHeight, 0],
				new Jolt.BoxShape([halfVehicleWidth, halfVehicleHeight, halfVehicleLength])).Create().Get();
			const tankBodySettings = new Jolt.BodyCreationSettings(tankShape, [0, 2, 0], quatY(Math.PI), Jolt.EMotionType.Dynamic, LAYER_MOVING);
			tankBodySettings.mOverrideMassProperties = Jolt.EOverrideMassProperties.CalculateInertia;
			tankBodySettings.GetMassPropertiesOverride().mMass = vehicleMass;
			const tankBody = bodyInterface.CreateBody(tankBodySettings);
			bodyInterface.AddBody(tankBody.GetID(), Jolt.EActivation.Activate);
			const tank = new THREE.Mesh(new THREE.BoxGeometry(2 * halfVehicleWidth, 2 * halfVehicleHeight, 2 * halfVehicleLength), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
			tank.matrixAutoUpdate = false;
			tank.userData = { id: tankBody.GetID(), com: false };
			Example.scene.add(tank);
			Example.dynamicObjects.push(tank);

			const vehicle = new Jolt.VehicleConstraintSettings();
			vehicle.mMaxPitchRollAngle = maxPitchRollAngle;
			const controllerSettings = new Jolt.TrackedVehicleControllerSettings();
			vehicle.SetController(controllerSettings);
			let wheelCount = 0;
			for (let t = 0; t < 2; ++t) {
				const track = controllerSettings.GetTrack(t);
				track.mDrivenWheel = wheelCount + (wheelPos.length - 1);
				wheelPos.forEach((loc, wheel) => {
					const w = new Jolt.WheelSettingsTV();
					w.mPosition = [t == 0 ? halfVehicleWidth : -halfVehicleWidth, loc[0], loc[1]];
					w.mRadius = wheelRadius; w.mWidth = wheelWidth;
					w.mSuspensionMinLength = suspensionMinLength;
					w.mSuspensionMaxLength = (wheel == 0 || wheel == wheelPos.length - 1) ? suspensionMinLength : suspensionMaxLength;
					w.GetSuspensionSpring().mFrequency = suspensionFrequency;
					track.AddWheel(wheelCount);
					vehicle.AddWheel(w);
					wheelCount++;
				});
			}

			// turret + barrel (children of the tank body)
			const turret = new THREE.Mesh(new THREE.BoxGeometry(2 * halfTurretWidth, 2 * halfTurretHeight, 2 * halfTurretLength), tankMat1);
			turret.position.set(0, halfVehicleHeight + halfTurretHeight, 0);
			tank.add(turret);
			const barrel = new THREE.Mesh(new THREE.CylinderGeometry(barrelRadius, barrelRadius, 2 * halfBarrelLength, 20, 1), tankMat2);
			barrel.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
			barrel.position.set(0, halfVehicleHeight + halfTurretHeight, halfTurretLength + halfBarrelLength);
			tank.add(barrel);

			const constraint = new Jolt.VehicleConstraint(tankBody, vehicle);
			constraint.SetVehicleCollisionTester(new Jolt.VehicleCollisionTesterRay(LAYER_MOVING));
			physicsSystem.AddConstraint(constraint);
			Jolt.addVehicleStepListener(physicsSystem, constraint);
			const controller = constraint.GetTrackedController();

			const modelWheels = [];
			for (let i = 0; i < wheelCount; i++) modelWheels.push(createThreeWheel(constraint, i, tank));

			const input = { forwardPressed: false, backwardPressed: false, leftPressed: false, rightPressed: false };
			const minVelocityPivotTurn = 1.0;
			const _r = new Float32Array(4), _v = new Float32Array(3), _p = new Float32Array(3);
			const prePhysicsUpdate = () => {
				let forward = 0.0, leftRatio = 1.0, rightRatio = 1.0, brake = 0.0;
				tankBody.GetRotation(_r); tankBody.GetLinearVelocity(_v);
				const rot = new THREE.Quaternion(_r[0], _r[1], _r[2], _r[3]).conjugate();
				const velocity = new THREE.Vector3(_v[0], _v[1], _v[2]).applyQuaternion(rot).z;
				forward = input.forwardPressed ? 1.0 : (input.backwardPressed ? -1.0 : 0.0);
				if (input.leftPressed || input.rightPressed) {
					if (input.leftPressed) {
						if (brake == 0.0 && forward == 0.0 && Math.abs(velocity) < minVelocityPivotTurn) { leftRatio = -1.0; forward = 1.0; }
						else leftRatio = 0.6;
					} else {
						if (brake == 0.0 && forward == 0.0 && Math.abs(velocity) < minVelocityPivotTurn) { rightRatio = -1.0; forward = 1.0; }
						else rightRatio = 0.6;
					}
				}
				if (previousForward * forward < 0.0) {
					if ((forward > 0.0 && velocity < -0.1) || (forward < 0.0 && velocity > 0.1)) { forward = 0.0; brake = 1.0; }
					else previousForward = forward;
				}
				controller.SetDriverInput(forward, leftRatio, rightRatio, brake);
				if (rightRatio != 0.0 || leftRatio != 0.0 || forward != 0.0 || brake != 0.0)
					bodyInterface.ActivateBody(tankBody.GetID());
			};

			controls.target = tank.position;
			tankBody.GetPosition(_p); let oldPos = new THREE.Vector3(_p[0], _p[1], _p[2]);
			setOnUpdate(() => {
				prePhysicsUpdate();
				tankBody.GetPosition(_p); const pos = new THREE.Vector3(_p[0], _p[1], _p[2]);
				camera.position.add(pos.clone().sub(oldPos)); oldPos = pos;
				modelWheels.forEach(wheel => wheel.updateLocalTransform());
			});

			document.addEventListener('keydown', (e) => { const k = e.key; if (k == 'w') input.forwardPressed = true; else if (k == 's') input.backwardPressed = true; else if (k == 'a') input.leftPressed = true; else if (k == 'd') input.rightPressed = true; }, false);
			document.addEventListener('keyup', (e) => { const k = e.key; if (k == 'w') input.forwardPressed = false; else if (k == 's') input.backwardPressed = false; else if (k == 'a') input.leftPressed = false; else if (k == 'd') input.rightPressed = false; }, false);
		</script>
	</body>
</html>
