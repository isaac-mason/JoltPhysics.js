<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js multi-threaded conveyor belt<br />
		Surface velocities applied from a contact listener that runs on the physics worker threads (ThreadedContactListener)</div>

		<!-- Runs BOTH as a page module (on the main thread, to publish globalThis.onWorker)
		     and, as a blob import, inside every physics worker thread. Contact callbacks
		     fire on worker threads, so each worker installs its own thread-local dispatch
		     globals. No THREE here — the worker has no importmap; use plain-array math +
		     the getContact*/rotateVectorByBody/setContact* pointer helpers. -->
		<script id="workerScript" type="module">
			const onWorker = globalThis.onWorker = async (Jolt, args) => {
				const DegreesToRadians = (deg) => deg * (Math.PI / 180.0);
				const cLocalSpaceVelocity = [0, 0, -10.0];
				const cLocalSpaceAngularVelocity = [0, DegreesToRadians(10.0), 0];
				const { linearBelts, angularBelt } = args;
				const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
				const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

				// b1/b2 are raw Body* (numbers); s is a raw ContactSettings*.
				const onContact = (b1, b2, s) => {
					const id1 = Jolt.getContactBodyID(b1), id2 = Jolt.getContactBodyID(b2);
					const l1 = linearBelts.includes(id1), l2 = linearBelts.includes(id2);
					if (l1 || l2) {
						// Determine the world space surface velocity of both bodies
						const v1 = l1 ? Jolt.rotateVectorByBody(b1, cLocalSpaceVelocity) : [0, 0, 0];
						const v2 = l2 ? Jolt.rotateVectorByBody(b2, cLocalSpaceVelocity) : [0, 0, 0];
						Jolt.setContactRelativeLinearSurfaceVelocity(s, sub(v2, v1)); // relative surface velocity
					}

					const angularBodyId = angularBelt[0];
					const a1 = id1 == angularBodyId, a2 = id2 == angularBodyId;
					if (a1 || a2) {
						const w1 = a1 ? Jolt.rotateVectorByBody(b1, cLocalSpaceAngularVelocity) : [0, 0, 0];
						const w2 = a2 ? Jolt.rotateVectorByBody(b2, cLocalSpaceAngularVelocity) : [0, 0, 0];
						// The angular velocity is around body 1's center of mass, so add the linear velocity of body 2's COM
						const com1 = Jolt.getContactBodyCOM(b1), com2 = Jolt.getContactBodyCOM(b2);
						const relLin = a2 ? cross(w2, sub(com1, com2)) : [0, 0, 0];
						Jolt.setContactRelativeLinearSurfaceVelocity(s, relLin);
						Jolt.setContactRelativeAngularSurfaceVelocity(s, sub(w2, w1));
					}
				};
				globalThis.__joltOnContactAdded = onContact;
				globalThis.__joltOnContactPersisted = onContact; // same behavior as contact added
			};
			export default onWorker;
		</script>

		<script type="module">
			import initJolt from '../dist/jolt-physics.multithread.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, createFloor, createBox, DegreesToRadians, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();

			// Point the physics worker threads at the module above + a shared belt-id buffer.
			// SharedArrayBuffers survive the worker postMessage, so the main thread can fill
			// the belt ids AFTER the workers spawn and they will still see them. Must happen
			// before initExample creates the JoltInterface (which spawns the job-system pool).
			const workerUrl = URL.createObjectURL(new Blob([document.getElementById('workerScript').innerHTML], { type: 'text/javascript' }));
			const workerParams = {
				linearBelts: new Uint32Array(new SharedArrayBuffer(20)), // 5 belts (4 loop + 1 dynamic)
				angularBelt: new Uint32Array(new SharedArrayBuffer(4)),  // 1 belt
			};
			Jolt.configureWorkerScripts(workerUrl, workerParams);

			initExample(Jolt, null);
			const { physicsSystem, bodyInterface, camera } = Example;
			camera.position.z += 60; camera.position.y += 20; camera.position.x += 50;

			createFloor(100);

			// Conveyor belts arranged in a loop
			const cBeltWidth = 10.0;
			const cBeltLength = 50.0;
			const linearBelts = [];
			for (let i = 0; i < 4; ++i) {
				const friction = 0.25 * (i + 1);
				const rot1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.5 * Math.PI * i);
				const rot2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), DegreesToRadians(1.0));
				const rotation = rot1.clone().multiply(rot2);
				const position = new THREE.Vector3(cBeltLength, 6.0, cBeltWidth).applyQuaternion(rotation);
				const belt = createBox([position.x, position.y, position.z], [rotation.x, rotation.y, rotation.z, rotation.w], [cBeltWidth, 0.1, cBeltLength], Jolt.EMotionType.Static, LAYER_NON_MOVING);
				belt.SetFriction(friction);
				linearBelts.push(belt);
			}

			// Bodies with decreasing friction
			for (let i = 0; i <= 10; ++i) {
				const cargo = createBox([-cBeltLength + i * 10.0, 10.0, -cBeltLength], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING);
				cargo.SetFriction(Math.max(0.0, 1.0 - 0.1 * i));
			}

			// Two rolling cylinders
			let cyl = new Jolt.BodyCreationSettings(new Jolt.CylinderShape(6.0, 1.0), [-25.0, 1.0, -20.0], (() => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.5 * Math.PI); return [q.x, q.y, q.z, q.w]; })(), Jolt.EMotionType.Dynamic, LAYER_MOVING);
			Example.addToScene(bodyInterface.CreateBody(cyl), 0xff0000);
			cyl.mPosition = [-25.0, 1.0, 20.0];
			Example.addToScene(bodyInterface.CreateBody(cyl), 0xff0000);

			// A dynamic belt with cargo resting on it
			{
				const dynamicBelt = createBox([-25.0, 3.0, 0], [0, 0, 0, 1], [5.0, 0.1, 25.0], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x333399);
				linearBelts.push(dynamicBelt);
				const cargo = createBox([-25.0, 6.0, 15.0], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x990099);
				cargo.SetFriction(1);
			}

			// An angular belt
			const angularBelt = createBox([10.0, 3.0, 0], [0, 0, 0, 1], [20.0, 0.1, 20.0], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x993333);
			for (let i = 0; i <= 6; ++i) {
				const cargo = createBox([10.0, 10.0, -15.0 + 5.0 * i], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x339999);
				cargo.SetFriction(Math.max(0.0, 1.0 - 0.1 * i));
			}

			// Publish the belt ids into the shared buffers (numeric ids), set up the main-thread
			// dispatch globals too, then install the cross-thread contact listener.
			workerParams.angularBelt[0] = angularBelt.GetID();
			workerParams.linearBelts.set(linearBelts.map((belt) => belt.GetID()));
			globalThis.onWorker(Jolt, workerParams);
			physicsSystem.SetContactListener(new Jolt.ThreadedContactListener());
		</script>
	</body>
</html>
