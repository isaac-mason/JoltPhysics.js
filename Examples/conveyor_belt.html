<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js conveyor belt demo<br/>
		Linear and angular conveyor belts (contact surface velocity)</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as THREE from 'three';
			import * as Example from './js/example.js';
			import { initExample, createFloor, createBox, DegreesToRadians, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { physicsSystem, bodyInterface, camera } = Example;
			camera.position.z += 60; camera.position.y += 20; camera.position.x += 50;

			createFloor(100);

			const cBeltWidth = 10.0;
			const cBeltLength = 50.0;
			const linearBelts = [];
			for (let i = 0; i < 4; ++i) {
				const friction = 0.25 * (i + 1);
				const rot1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.5 * Math.PI * i);
				const rot2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), DegreesToRadians(1.0));
				const rotation = rot1.clone().multiply(rot2);
				const position = new THREE.Vector3(cBeltLength, 6.0, cBeltWidth).applyQuaternion(rotation);
				const belt = createBox([position.x, position.y, position.z], [rotation.x, rotation.y, rotation.z, rotation.w], [cBeltWidth, 0.1, cBeltLength], Jolt.EMotionType.Static, LAYER_NON_MOVING);
				belt.SetFriction(friction);
				linearBelts.push(belt);
			}
			for (let i = 0; i <= 10; ++i) {
				const cargo = createBox([-cBeltLength + i * 10.0, 10.0, -cBeltLength], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING);
				cargo.SetFriction(Math.max(0.0, 1.0 - 0.1 * i));
			}
			// two rolling cylinders
			let cyl = new Jolt.BodyCreationSettings(new Jolt.CylinderShape(6.0, 1.0), [-25.0, 1.0, -20.0], (() => { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.5 * Math.PI); return [q.x, q.y, q.z, q.w]; })(), Jolt.EMotionType.Dynamic, LAYER_MOVING);
			Example.addToScene(bodyInterface.CreateBody(cyl), 0xff0000);
			cyl.mPosition = [-25.0, 1.0, 20.0];
			Example.addToScene(bodyInterface.CreateBody(cyl), 0xff0000);
			{
				const dynamicBelt = createBox([-25.0, 3.0, 0], [0, 0, 0, 1], [5.0, 0.1, 25.0], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x333399);
				linearBelts.push(dynamicBelt);
				const cargo = createBox([-25.0, 6.0, 15.0], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x990099);
				cargo.SetFriction(1);
			}
			const angularBelt = createBox([10.0, 3.0, 0], [0, 0, 0, 1], [20.0, 0.1, 20.0], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x993333);
			for (let i = 0; i <= 6; ++i) {
				const cargo = createBox([10.0, 10.0, -15.0 + 5.0 * i], [0, 0, 0, 1], [2, 2, 2], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x339999);
				cargo.SetFriction(Math.max(0.0, 1.0 - 0.1 * i));
			}

			// surface velocities applied via the contact listener (mathcat: read rotations
			// as arrays, do the quaternion/cross math with THREE, write settings arrays).
			const cLocalSpaceVelocity = [0, 0, -10.0];
			const cLocalSpaceAngularVelocity = [0, DegreesToRadians(10.0), 0];
			const angularBeltId = angularBelt.GetID();
			const _r = new Float32Array(4), _c1 = new Float32Array(3), _c2 = new Float32Array(3);
			const applyQuat = (rotArr, v) => new THREE.Vector3(v[0], v[1], v[2]).applyQuaternion(new THREE.Quaternion(rotArr[0], rotArr[1], rotArr[2], rotArr[3]));

			const onContact = (body1, body2, manifold, settings) => {
				const body1ID = body1.GetID(), body2ID = body2.GetID();
				body1.GetRotation(_r); const rotation1 = [_r[0], _r[1], _r[2], _r[3]];
				body2.GetRotation(_r); const rotation2 = [_r[0], _r[1], _r[2], _r[3]];
				const body1LinearBelt = linearBelts.find(belt => belt.GetID() == body1ID);
				const body2LinearBelt = linearBelts.find(belt => belt.GetID() == body2ID);
				if (body1LinearBelt || body2LinearBelt) {
					const v1 = body1LinearBelt ? applyQuat(rotation1, cLocalSpaceVelocity) : new THREE.Vector3();
					const v2 = body2LinearBelt ? applyQuat(rotation2, cLocalSpaceVelocity) : new THREE.Vector3();
					const rel = v2.clone().sub(v1);
					settings.mRelativeLinearSurfaceVelocity = [rel.x, rel.y, rel.z];
				}
				const body1Angular = body1ID == angularBeltId;
				const body2Angular = body2ID == angularBeltId;
				if (body1Angular || body2Angular) {
					const a1 = body1Angular ? applyQuat(rotation1, cLocalSpaceAngularVelocity) : new THREE.Vector3();
					const a2 = body2Angular ? applyQuat(rotation2, cLocalSpaceAngularVelocity) : new THREE.Vector3();
					body1.GetCenterOfMassPosition(_c1); body2.GetCenterOfMassPosition(_c2);
					const com1 = new THREE.Vector3(_c1[0], _c1[1], _c1[2]);
					const com2 = new THREE.Vector3(_c2[0], _c2[1], _c2[2]);
					const relLin = body2Angular ? a2.clone().cross(com1.clone().sub(com2)) : new THREE.Vector3();
					settings.mRelativeLinearSurfaceVelocity = [relLin.x, relLin.y, relLin.z];
					const relAng = a2.clone().sub(a1);
					settings.mRelativeAngularSurfaceVelocity = [relAng.x, relAng.y, relAng.z];
				}
			};
			physicsSystem.SetContactListener(new Jolt.ContactListener.implement({
				OnContactValidate: () => Jolt.ValidateResult.AcceptAllContactsForThisBodyPair,
				OnContactAdded: onContact,
				OnContactPersisted: onContact,
				OnContactRemoved: () => {},
			}));
		</script>
	</body>
</html>
