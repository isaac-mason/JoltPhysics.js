<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js motor demo<br/>
		A hinge motor (windmill) and a slider motor (sliding block)</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as Example from './js/example.js';
			import { initExample, setOnUpdate, createFloor, createBox, createSphere, addToScene, LAYER_MOVING, LAYER_NON_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			initExample(Jolt, null);
			const { physicsSystem, bodyInterface, camera, dynamicObjects } = Example;
			const IDENTITY = [0, 0, 0, 1];

			camera.position.z += 35;

			createFloor();

			const makeWindmill = () => {
				const box = createBox([0, 10, 0], IDENTITY, [0.25, 0.25, 0.25], Jolt.EMotionType.Static, LAYER_NON_MOVING);
				let wingsShapeSettings = new Jolt.StaticCompoundShapeSettings();
				wingsShapeSettings.AddShape([5, 0, 0], IDENTITY, new Jolt.BoxShape([4, 0.5, 0.5]));
				wingsShapeSettings.AddShape([-5, 0, 0], IDENTITY, new Jolt.BoxShape([4, 0.5, 0.5]));
				wingsShapeSettings.AddShape([0, 5, 0], IDENTITY, new Jolt.BoxShape([0.5, 4, 0.5]));
				wingsShapeSettings.AddShape([0, -5, 0], IDENTITY, new Jolt.BoxShape([0.5, 4, 0.5]));
				let wingsShape = wingsShapeSettings.Create().Get();
				const wingsCreationSettings = new Jolt.BodyCreationSettings(wingsShape, [0, 10, 0], IDENTITY, Jolt.EMotionType.Dynamic, LAYER_MOVING);
				let wing = bodyInterface.CreateBody(wingsCreationSettings);
				addToScene(wing, 0xff0000);
				let c = new Jolt.HingeConstraintSettings();
				c.mPoint1 = c.mPoint2 = [0, 10, 0];
				c.mHingeAxis1 = c.mHingeAxis2 = [0, 0, 1];
				c.mNormalAxis1 = c.mNormalAxis2 = [1, 0, 0];
				const hinge = c.Create(box, wing);   // RTTI auto-downcasts to HingeConstraint
				physicsSystem.AddConstraint(hinge);
				hinge.SetMotorState(Jolt.EMotorState.Velocity);
				hinge.SetTargetAngularVelocity(-5);
				const sphere = createSphere([-20, 2, 0], 2, Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x118811);
				sphere.GetMotionProperties().SetInverseMass(1.0 / 15);
				bodyInterface.AddImpulse(sphere.GetID(), [250.0, 0, 0]);
				sphere.SetRestitution(0.45);
				createBox([-25, 15, 0], IDENTITY, [0.2, 15, 5], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x661122);
				createBox([50, 0, 0], IDENTITY, [0.2, 150, 50], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x661122);
				dynamicObjects.pop().visible = false;
				createBox([0, 75, 0], IDENTITY, [150, 0.2, 50], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x661122);
				dynamicObjects.pop().visible = false;
			}
			const createSlider = () => {
				createBox([18, 0.25, 0], IDENTITY, [12.5, 0.25, 2], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x993333);
				const target = createBox([30, 2, 0], IDENTITY, [0.5, 2, 2], Jolt.EMotionType.Static, LAYER_NON_MOVING, 0x666633);
				const box = createBox([15, 1.25, 0], IDENTITY, [0.75, 0.75, 0.75], Jolt.EMotionType.Dynamic, LAYER_MOVING, 0x003366);
				const colors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00];
				const offsets = [0, 4, 13, 21];
				colors.forEach((color, index) => {
					createBox([28 - offsets[index], 2, -2.75], IDENTITY, [1, 4, 0.75], Jolt.EMotionType.Static, LAYER_NON_MOVING, color);
				})
				const c = new Jolt.SliderConstraintSettings();
				c.mPoint1 = [15, 1.25, 0];
				c.mPoint2 = [28, 1.25, 0];
				c.mSliderAxis1 = c.mSliderAxis2 = [1, 0, 0];
				c.mNormalAxis1 = c.mNormalAxis2 = [0, 1, 0];
				const slider = c.Create(box, target);   // RTTI auto-downcasts to SliderConstraint
				physicsSystem.AddConstraint(slider);
				slider.SetMotorState(Jolt.EMotorState.Position);
				slider.SetTargetPosition(0);
				let pTime = 0;
				let counter = 4; // Starts the motor counter closer to the initial spawn point
				setOnUpdate((time, deltaTime) => {
					if (time - pTime > 1.0) {
						pTime = time;
						const index = Math.abs(counter++ % (offsets.length * 2 - 2) - (offsets.length - 1));
						slider.SetTargetPosition(offsets[index]);
						bodyInterface.ActivateBody(box.GetID());
					}
				});
			}
			makeWindmill();
			createSlider();
		</script>
	</body>
</html>
