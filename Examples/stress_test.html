<!DOCTYPE html>
<html lang="en">
	<head>
		<title>JoltPhysics.js demo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>
		<div id="container">Loading...</div>
		<div id="info">JoltPhysics.js stress test<br/>
		A pyramid of boxes with a heavy box dropped on top</div>

		<script type="module">
			import initJolt from '../dist/jolt-physics.wasm-compat.js';
			import * as Example from './js/example.js';
			import { initExample, createFloor, addToScene, LAYER_MOVING } from './js/example.js';

			const Jolt = await initJolt();
			let towerHeight = 11;

			initExample(Jolt, null);
			const bodyInterface = Example.bodyInterface;

			createFloor();

			let shape = new Jolt.BoxShape([0.5, 0.5, 0.5]);
			let creationSettings = new Jolt.BodyCreationSettings(shape, [0, 0, 0], [0, 0, 0, 1], Jolt.EMotionType.Dynamic, LAYER_MOVING);

			for (let y = 0; y < towerHeight; y++) {

				let baseOffset = towerHeight - 1 - y;

				for (let x = -baseOffset; x <= baseOffset; x++) {
					for (let z = -baseOffset; z <= baseOffset; z++) {
						creationSettings.mPosition = [x, y + 0.5, z];
						let body = bodyInterface.CreateBody(creationSettings);

						addToScene(body, 0xffffff);
					}
				}
			}

			shape = new Jolt.BoxShape([1, 1, 1]);
			let body = bodyInterface.CreateBody(new Jolt.BodyCreationSettings(shape, [0, 20, 0], [0, 0, 0, 1], Jolt.EMotionType.Dynamic, LAYER_MOVING));
			addToScene(body, 0xff0000);
		</script>
	</body>
</html>
