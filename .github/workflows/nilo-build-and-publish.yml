name: Nilo Build and Publish

# Nilo fork's CI: builds against the Nilo C++ JoltPhysics fork (sibling-cloned outside
# $GITHUB_WORKSPACE for clean DWARF) and publishes the build as a GitHub Release with
# both the npm-installable .tgz and a dist tar.gz attached. Consumers (e.g. Nilo) pin
# the .tgz URL directly in package.json -- no npm registry, no auth required.
#
# Upstream's `build-and-deploy.yml` is preserved verbatim alongside this file so future
# upstream merges are conflict-free. Disable that workflow in the fork via:
#   repo Settings -> Actions -> Workflows -> "Build and Deploy" -> ... -> Disable workflow
# It would otherwise also fire on push to main, fail the npm publish (no NPM_TOKEN), and
# clobber the gh-pages branch.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      jpjs_ref:
        description: "JoltPhysics.js ref to build. Empty = latest v*-nilo.* tag in this repo (default). Pass `nilo` to build the head of the nilo branch, or any tag/SHA to pin."
        required: false
        default: ""
        type: string
      jolt_ref:
        description: "Jolt C++ ref: tag or branch name that exists on GitHub (e.g. nilo-v5.5.0 or master). Push paired tags first: git push origin nilo-v5.5.0"
        required: false
        default: "nilo-v5.5.0"
        type: string
      dry_run:
        description: "If true, build only (skip gh-pages and GitHub Release)."
        required: false
        default: true
        type: boolean

permissions:
  id-token: write # Required for OIDC
  contents: write # Examples gh-pages + checkout + GitHub Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # Paired tag with JoltPhysics.js; keep in sync with CMake default JOLT_PHYSICS_GIT_TAG.
      # workflow_dispatch can override via the jolt_ref input.
      JOLT_PHYSICS_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.jolt_ref || 'nilo-v5.5.0') || 'nilo-v5.5.0' }}

    steps:
    # Default workflow_dispatch behavior of `actions/checkout` is "build the dispatched
    # branch's HEAD", which means a manual run from the GitHub UI builds whatever is
    # currently on `nilo` -- easy to ship a half-finished commit. Instead, default to the
    # latest `v*-nilo.*` tag (release tags are only ever cut from `nilo`, so this is
    # equivalent to "latest release on nilo") and require an explicit override to build
    # anything else. `git ls-remote` doesn't need a checked-out repo, so this step runs
    # before `actions/checkout`.
    - name: Resolve JoltPhysics.js ref to build
      id: resolve_jpjs_ref
      shell: bash
      run: |
        set -euo pipefail
        INPUT_REF="${{ github.event.inputs.jpjs_ref }}"
        if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
          # Push events build the pushed commit verbatim (preserves auto-publish on main).
          REF="${GITHUB_SHA}"
          echo "Push event: building ${REF}"
        elif [ -n "${INPUT_REF}" ]; then
          REF="${INPUT_REF}"
          echo "Override: building user-supplied ref '${REF}'"
        else
          REMOTE="https://github.com/${GITHUB_REPOSITORY}"
          # `--sort=-version:refname` puts the highest semver-style version first; the
          # `^{}` filter drops dereferenced annotated-tag rows.
          LATEST_TAG=$(git ls-remote --tags --sort='-version:refname' "${REMOTE}" 'refs/tags/v*-nilo.*' \
            | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}$' | head -n 1)
          if [ -z "${LATEST_TAG}" ]; then
            echo "::error::No v*-nilo.* tags found on ${REMOTE}. Tag a release on nilo (e.g. v5.5.0-nilo.11) or pass jpjs_ref explicitly (e.g. 'nilo' for branch HEAD)."
            exit 1
          fi
          REF="${LATEST_TAG}"
          echo "Default: building latest v*-nilo.* tag '${REF}'"
        fi
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.resolve_jpjs_ref.outputs.ref }}

    # Shallow fetch (checkout default depth=1) often cannot resolve tags; depth=0 fixes that once the ref exists on GitHub.
    - name: Verify Jolt ref exists on GitHub
      env:
        JOLT_REF: ${{ env.JOLT_PHYSICS_CHECKOUT_REF }}
      run: |
        set -euo pipefail
        URL="https://github.com/nilo-technologies/JoltPhysics"
        out="$(git ls-remote "$URL" "refs/tags/${JOLT_REF}" "refs/heads/${JOLT_REF}" 2>/dev/null || true)"
        if [ -n "${out}" ]; then
          echo "Resolved Jolt ref on ${URL}:"
          echo "${out}"
          exit 0
        fi
        if echo "${JOLT_REF}" | grep -qE '^[0-9a-f]{40}$'; then
          echo "JOLT_REF looks like a full SHA; skipping tag/branch preflight."
          exit 0
        fi
        echo "::error::Ref '${JOLT_REF}' not found on ${URL} as a tag or branch. Push it (e.g. git push origin ${JOLT_REF}) or re-run with jolt_ref=master until tags are published."
        exit 1

    # NOTE: deliberately NOT using actions/checkout for the C++ repo. We need the
    # JoltPhysics clone to live OUTSIDE $GITHUB_WORKSPACE so its absolute path is
    # not a strict suffix-of-prefix of the JoltPhysics.js workspace path. Otherwise
    # Clang's -fdebug-prefix-map (which stores rules in a sorted container, not
    # command-line order) applies the JS-repo rule to Jolt sources first, producing
    # nested ``JoltPhysics.js/JoltPhysics/Jolt/...`` paths in DWARF that no
    # downstream consumer can resolve. Cloning into $RUNNER_TEMP gives us
    # /home/runner/_work/_temp/JoltPhysics which sits next to (not inside)
    # /home/runner/work/JoltPhysics.js/JoltPhysics.js, so the two -fdebug-prefix-map
    # source prefixes don't nest and each rule maps the correct files.
    - name: Checkout Jolt (C++) outside workspace
      env:
        JOLT_REF: ${{ env.JOLT_PHYSICS_CHECKOUT_REF }}
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${RUNNER_TEMP}/JoltPhysics"
        rm -rf "${TARGET}"
        git clone --depth=1 --branch "${JOLT_REF}" \
          https://github.com/nilo-technologies/JoltPhysics "${TARGET}"
        test -f "${TARGET}/Build/CMakeLists.txt" || { echo "::error::Missing Build/CMakeLists.txt in ${TARGET}"; exit 1; }
        echo "JoltPhysics checked out at: ${TARGET}"
        echo "Head: $(git -C "${TARGET}" rev-parse HEAD)"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Build (Nilo)
      run: ./ci/nilo-build.sh
      shell: bash
      env:
        # ci/nilo-build.sh passes this as -DJOLT_PHYSICS_PATH so the job uses
        # the sibling clone above (not FetchContent, not a workspace subdir).
        NILO_CI_JOLT_PHYSICS_PATH: ${{ runner.temp }}/JoltPhysics

    - name: Deploy Examples
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Examples
        force_orphan: true

    - name: Upload dist (dry run artifact)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: jolt-physics-dist
        path: dist/

    # Skip the release flow when the tag for this package.json version already exists,
    # so a no-op rebuild on main doesn't try to clobber a published release.
    - name: Check whether GitHub Release should be created
      id: pkg_publish
      if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(node -pe "require('./package.json').version")
        TAG="v${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "would_publish=false" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} already exists; skipping dist pack + GitHub Release for this run."
        else
          echo "would_publish=true" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} does not exist; will pack and create the release."
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Pack dist for GitHub Release
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.pkg_publish.outputs.would_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.pkg_publish.outputs.version }}"
        # The "ref" we record is what the user asked for (resolved tag, override, or
        # SHA); the post-checkout SHA is what we actually built. Both are useful when
        # tracing a release back to source.
        BUILT_SHA=$(git rev-parse HEAD)
        {
          echo "npm_package_version=${VERSION}"
          echo "jolt_cpp_checkout_ref=${JOLT_PHYSICS_CHECKOUT_REF}"
          echo "joltphysics_js_repository=${GITHUB_REPOSITORY}"
          echo "joltphysics_js_ref=${{ steps.resolve_jpjs_ref.outputs.ref }}"
          echo "joltphysics_js_sha=${BUILT_SHA}"
          echo "github_event=${GITHUB_EVENT_NAME}"
          echo "github_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > dist/BUILD_INFO.txt
        tar -czf "jolt-physics-${VERSION}-dist.tar.gz" -C dist .
        ls -la "jolt-physics-${VERSION}-dist.tar.gz"

    # The .tgz from `npm pack` is what consumers install via a tarball URL pin
    # (no npm registry, no auth). `npm pack` honors package.json#files so it ships
    # the same contents an `npm publish` would have.
    - name: Pack npm tarball for tarball-URL consumers
      id: npm_pack
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.pkg_publish.outputs.would_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        TGZ=$(npm pack --silent)
        echo "Packed: ${TGZ}"
        ls -la "${TGZ}"
        echo "tgz=${TGZ}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release with dist artifacts
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.pkg_publish.outputs.would_publish == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.pkg_publish.outputs.version }}
        name: "jolt-physics ${{ steps.pkg_publish.outputs.version }}"
        body: |
          ## Artifacts

          **`${{ steps.npm_pack.outputs.tgz }}`** is the npm-installable tarball produced by `npm pack`. Pin it directly in `package.json`:

          ```json
          "jolt-physics": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.pkg_publish.outputs.version }}/${{ steps.npm_pack.outputs.tgz }}"
          ```

          Public-repo release assets are anonymous-readable, so this works from CI / Vercel / dev machines with no token plumbing.

          **`jolt-physics-${{ steps.pkg_publish.outputs.version }}-dist.tar.gz`** is a gzip tar of the full `dist/` tree from CI (wasm-compat single-file, debug wasm-compat, plain wasm + `.wasm` sidecars, multithread variants, `types.d.ts`, etc.), including `BUILD_INFO.txt` with provenance. Use it for Wasm/DWARF debugging, symbolication uploads, or diffing against the npm tarball contents.

          | Field | Value |
          | --- | --- |
          | Jolt C++ ref | `${{ env.JOLT_PHYSICS_CHECKOUT_REF }}` |
          | JoltPhysics.js ref | `${{ steps.resolve_jpjs_ref.outputs.ref }}` |
          | Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
        files: |
          jolt-physics-${{ steps.pkg_publish.outputs.version }}-dist.tar.gz
          ${{ steps.npm_pack.outputs.tgz }}
        fail_on_unmatched_files: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
